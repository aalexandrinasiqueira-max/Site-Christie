<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ana Carolina">
    <title>Cadastro — Veneno e Chá das Cinco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barrio&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 class="fonte-barrio">Veneno e Chá das Cinco</h1>
        <p class="subtitle">Crie sua conta e entre para o clube.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="agatha.html">Biografia</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <main class="main">
        <section class="form-box">
            <h2>Cadastre-se</h2>

            <form action="#" method="post">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" minlength="6" placeholder="Digite sua senha" required>

                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar" name="confirmar" minlength="6" placeholder="Confirme sua senha" required>
                
                <button type="submit" class="btn-primary">Criar conta</button>
            </form>

            <p class="form-link">Já tem conta? <a href="login.html">Faça login</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Um cantinho para Agatha Christie e seus fãs, feita por Ana Carolina. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
