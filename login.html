<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ana Carolina">
    <title>Login — Veneno e Chá das Cinco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barrio&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 class="fonte-barrio">Veneno e Chá das Cinco</h1>
        <p class="subtitle">Que bom ter você de volta, detetive.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="cadastro.html">Cadastre-se</a></li>
        </ul>
    </nav>
    
    <main class="main">
        <form id="formLogin" action="#" method="post">
            <h2>Login</h2>

            <form action="#" method="post">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <p class="form-link">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Um cantinho para Agatha Christie e seus fãs, feita por Ana Carolina. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
